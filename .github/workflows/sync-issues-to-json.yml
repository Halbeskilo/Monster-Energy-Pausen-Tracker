name: Sync Monster Ratings & New Monsters from Issues

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sync_to_json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Issue JSON and update data/monsters.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = 'data/monsters.json';
          const body = process.env.ISSUE_BODY || '';
          const match = body.match(/```json\s*([\s\S]*?)```/);
          if (!match) {
            console.log('Kein JSON-Block im Issue gefunden – überspringe.');
            process.exit(0);
          }

          const payload = JSON.parse(match[1].trim());
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (payload.type === 'monster-rating' && payload.monsterId && payload.score) {
            const monster = data.monsters.find(m => Number(m.id) === Number(payload.monsterId));
            if (monster) {
              if (!Array.isArray(monster.ratings)) monster.ratings = [];
              const user = (payload.user || process.env.ISSUE_USER || 'Kollege').trim();
              const ratingEntry = {
                user,
                score: Number(payload.score),
                comment: payload.comment || '',
                date: payload.date || new Date().toISOString().slice(0, 10)
              };
              const existingIdx = monster.ratings.findIndex(r => (r.user || '').toLowerCase() === user.toLowerCase());
              if (existingIdx >= 0) {
                monster.ratings[existingIdx] = ratingEntry;
              } else {
                monster.ratings.push(ratingEntry);
              }
              monster.status = 'tested';
              data.meta.updatedAt = new Date().toISOString().slice(0, 10);
              fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n', 'utf8');
              console.log(`Bewertung für ${monster.name} gespeichert.`);
            }
          } else if (payload.type === 'new-monster' && payload.monster && payload.monster.name) {
            const maxId = data.monsters.reduce((max, m) => Math.max(max, Number(m.id) || 0), 0);
            const newMonster = {
              id: maxId + 1,
              name: payload.monster.name,
              category: payload.monster.category || 'Special Edition',
              status: payload.monster.status || 'upcoming',
              image: payload.monster.image || 'res/OriginalGreenMonsterEnergy.webp',
              caffeine: Number(payload.monster.caffeine) || 160,
              sugar: Number(payload.monster.sugar) || 0,
              taste: payload.monster.taste || '',
              ratings: []
            };
            data.monsters.push(newMonster);
            data.meta.updatedAt = new Date().toISOString().slice(0, 10);
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n', 'utf8');
            console.log(`Neues Monster ${newMonster.name} hinzugefügt.`);
          }
          EOF

      - name: Commit & Push updated data/monsters.json
        run: |
          if git diff --quiet data/monsters.json; then
            echo "Keine Änderungen an data/monsters.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/monsters.json
          git commit -m "chore(data): Sync aus Issue #${{ github.event.issue.number }}"
          git push

      - name: Close processed issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "✅ Automatisch in \`data/monsters.json\` übernommen!"
